name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rust/WASM build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build WASM
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Verify committed WASM is current
        run: cmp target/wasm32-unknown-unknown/release/nivtec_core.wasm pkg/nivtec_core.wasm

      - name: Upload static app artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivtec-calculator-static
          path: |
            web/
            pkg/nivtec_core.wasm
            README.md
